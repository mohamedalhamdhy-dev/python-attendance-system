<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presence Attendance — System Status</title><link rel="stylesheet" href="/themes.css">
<style>body{padding:clamp(16px,5vw,70px);min-height:100dvh;font:15px/1.6 Inter,Arial,sans-serif}main{max-width:720px;margin:0 auto}.tag{color:var(--accent);font-size:12px;text-transform:uppercase;letter-spacing:1.5px}h1{font-size:clamp(28px,4vw,42px);line-height:1.15}p{color:var(--muted)}.panel{padding:28px;border-radius:18px;background:var(--panel);border:1px solid var(--border)}.status-row{display:flex;align-items:center;justify-content:space-between;gap:18px;border-top:1px solid var(--border);padding:18px 0}.badge{padding:5px 12px;border-radius:40px;border:1px solid var(--border);background:var(--panel-2)}.ok{color:var(--success)}.fail{color:var(--danger)}button,a{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:9px 13px;color:var(--text);cursor:pointer;text-decoration:none}footer{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}small{color:var(--muted)}</style>
<script src="/status.js" defer></script></head><body data-theme="enterprise-dark"><main><div class="tag">PRESENCE ATTENDANCE</div><h1>System status</h1><p>Live connectivity checks for this website and the shared attendance API.</p><section class="panel"><div id="check-list" aria-live="polite">Checking services…</div><small id="last-checked"></small></section><footer><button id="refresh">Refresh status</button><a href="/">Return to portal</a></footer></main></body></html>
